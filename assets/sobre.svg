<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="Genilton Silva, desenvolvedor full-stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="g" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#e6e0c8"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2f4fd8"/></marker>
    <marker id="t" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M5 0V10" stroke="#8a836d" stroke-width="1.5"/></marker>
    <style>
      .serif{font-family:Georgia,'Times New Roman',serif}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="1200" height="440" rx="14" fill="#fffcf0"/>
  <rect x="14" y="14" width="1172" height="412" rx="6" fill="url(#g)" stroke="#d9d2b6"/>

  <text x="56" y="84" class="serif" font-size="28" fill="#22201a">genilton<tspan fill="#2f4fd8" font-style="italic">.</tspan></text>
  <text x="56" y="168" class="serif" font-size="44" fill="#22201a">Eu construo APIs, telas</text>
  <text x="56" y="218" class="serif" font-size="44" fill="#22201a">e sistemas que não caem.</text>
  <text class="serif" font-size="18" fill="#5e5947">
    <tspan x="56" y="276">Desenvolvedor full-stack há mais de cinco anos.</tspan>
    <tspan x="56" y="304">Java, Spring Boot e NestJS no back-end, Angular e</tspan>
    <tspan x="56" y="332">Next.js no front-end. Código que o próximo time lê.</tspan>
  </text>
  <text x="56" y="394" class="mono" font-size="13" fill="#8a836d">Fig. 001 — Os dois lados da aplicação</text>

  <!-- container / infra -->
  <rect x="664" y="72" width="500" height="290" rx="10" fill="none" stroke="#8a836d" stroke-dasharray="6 6"/>
  <text x="680" y="98" class="mono" font-size="13" fill="#8a836d">container · Docker + GitHub Actions</text>

  <!-- front -->
  <rect x="690" y="122" width="190" height="84" rx="6" fill="#fffcf0" stroke="#22201a" stroke-width="1.5"/>
  <text x="708" y="156" class="serif" font-size="22" fill="#22201a">Front-end</text>
  <text x="708" y="184" class="mono" font-size="13" fill="#5e5947">Angular · Next.js</text>

  <!-- back -->
  <rect x="948" y="122" width="190" height="84" rx="6" fill="#fffcf0" stroke="#22201a" stroke-width="1.5"/>
  <text x="966" y="156" class="serif" font-size="22" fill="#22201a">Back-end</text>
  <text x="966" y="184" class="mono" font-size="13" fill="#5e5947">Spring Boot · NestJS</text>

  <!-- contrato -->
  <path d="M884 164H944" stroke="#2f4fd8" stroke-width="2" fill="none" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="914" y="232" class="mono" font-size="12" fill="#2f4fd8" text-anchor="middle">contrato</text>
  <text x="914" y="248" class="mono" font-size="12" fill="#2f4fd8" text-anchor="middle">da API</text>

  <!-- dados -->
  <path d="M1043 206V262" stroke="#22201a" stroke-width="1.5"/>
  <rect x="948" y="262" width="190" height="72" rx="6" fill="#fffcf0" stroke="#22201a" stroke-width="1.5"/>
  <text x="966" y="292" class="serif" font-size="22" fill="#22201a">Dados</text>
  <text x="966" y="318" class="mono" font-size="13" fill="#5e5947">PostgreSQL · Redis</text>

  <!-- cota -->
  <path d="M690 392H1138" stroke="#8a836d" marker-start="url(#t)" marker-end="url(#t)"/>
  <rect x="848" y="382" width="132" height="20" fill="#fffcf0"/>
  <text x="914" y="397" class="mono" font-size="12" fill="#8a836d" text-anchor="middle">5+ anos de código</text>
</svg>
